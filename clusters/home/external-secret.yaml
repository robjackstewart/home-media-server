# One ExternalSecret per Kubernetes Secret the chart (or the tailscale-operator subchart) needs.
# Each target Secret's `name` is a static literal here, which has to match two other things that
# are NOT read from this file: the corresponding `*_secret_name` Terraform variable baked into the
# `infrastructure-values` Secret below (infrastructure/variables.tf's defaults - transmission_vpn_secret_name,
# mylar3_secret_name, rreading_glasses_secret_name), and, for `operator-oauth` specifically, the
# literal name/keys the tailscale-operator chart itself hardcodes (not configurable at all). None
# of these are overridden anywhere in this repo today, but if one ever is, update this file too.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn-credentials
  namespace: home-media-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: vpn-credentials
    creationPolicy: Owner
  data:
    - secretKey: wireguard_private_key
      remoteRef:
        key: vpn-wireguard-private-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mylar3-credentials
  namespace: home-media-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: mylar3-credentials
    creationPolicy: Owner
  data:
    - secretKey: comicvine_api_key
      remoteRef:
        key: comicvine-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rreading-glasses-credentials
  namespace: home-media-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: rreading-glasses-credentials
    creationPolicy: Owner
  data:
    - secretKey: hardcover_auth
      remoteRef:
        key: rreading-glasses-hardcover-auth
    - secretKey: postgres_password
      remoteRef:
        key: rreading-glasses-postgres-password
---
# Must be named exactly "operator-oauth" with exactly these two keys - hardcoded by the
# tailscale-operator Helm chart itself, not configurable (see helm/values.yaml's tailscale-operator
# comment). Previously created directly by Terraform's kubernetes_secret_v1 "tailscale_operator_oauth";
# now synced the same way as everything else here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: home-media-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-operator-oauth-client-id
    - secretKey: client_secret
      remoteRef:
        key: tailscale-operator-oauth-client-secret
---
# The merged non-secret+secret values blob (infrastructure/main.tf's locals.infrastructure_values,
# yamlencode'd into the Key Vault secret "infrastructure-values") - what used to be the gitignored
# helm/infrastructure.values.yaml Terraform wrote directly to disk. The umbrella HelmRelease
# (home-media-server.yaml) reads this via valuesFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infrastructure-values
  namespace: home-media-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: infrastructure-values
    creationPolicy: Owner
  data:
    - secretKey: values.yaml
      remoteRef:
        key: infrastructure-values
