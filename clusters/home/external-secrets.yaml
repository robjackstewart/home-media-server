# External Secrets Operator - pulls values from this project's own Key Vault into Kubernetes
# Secrets, authenticating via Workload Identity Federation on the Arc-connected cluster (see
# infrastructure/arc.tf's azurerm_user_assigned_identity/azurerm_federated_identity_credential
# "external_secrets"). No client secret is stored anywhere, in or out of the cluster.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: "2.10.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  timeout: 10m
  interval: 30m
  values:
    installCRDs: true
    # Pinned explicitly rather than left to the chart's fullname template, so
    # infrastructure/arc.tf's federated identity credential subject
    # ("system:serviceaccount:external-secrets:external-secrets") never depends on the release
    # name staying exactly "external-secrets".
    serviceAccount:
      name: external-secrets
      annotations:
        # REPLACE after the first `terraform apply`: run
        # `terraform output -raw external_secrets_identity_client_id` (infrastructure/outputs.tf)
        # and paste the result here, then commit. This value is a client ID (a public GUID, safe
        # to commit - not a secret), but it can only be known after Terraform has created the
        # identity, so it can't be filled in ahead of time the way every other value in this repo
        # is. Until it's filled in, ESO's pods can't authenticate to Key Vault and every
        # ExternalSecret in this directory stays stuck at SecretSyncError.
        azure.workload.identity/client-id: "REPLACE_WITH_TERRAFORM_OUTPUT_external_secrets_identity_client_id"
    podLabels:
      azure.workload.identity/use: "true"
