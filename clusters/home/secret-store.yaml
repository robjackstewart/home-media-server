# Cluster-wide source every ExternalSecret in this directory reads from - this project's own Key
# Vault (infrastructure/main.tf's azurerm_key_vault.keyvault), via the Workload Identity Federation
# set up in infrastructure/arc.tf. vaultUrl is not secret - the vault's actual secrets are gated by
# the access policy Terraform grants the "external-secrets" identity, not by this URL being hidden.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      # Matches infrastructure/variables.tf's azure_key_vault_name default - update this if that
      # variable is ever overridden away from its default in config/variables.tfvars.
      vaultUrl: "https://home-media-server-kv.vault.azure.net"
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
