# The umbrella chart (../../helm) - adopts the existing `home-media-server` Helm release in the
# `home-media-server` namespace in place (same release name, same namespace, so this HelmRelease's
# storage matches what `helm upgrade --install` created before Flux took over).
#
# `sourceRef` points at the GitRepository Azure Arc's Flux configuration creates automatically
# (infrastructure/arc.tf's azurerm_arc_kubernetes_flux_configuration "home") - named after that
# resource's own `name`, not declared anywhere in this directory.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-media-server
  namespace: home-media-server
spec:
  releaseName: home-media-server
  chart:
    spec:
      chart: ./helm
      sourceRef:
        kind: GitRepository
        name: home-media-server
        namespace: flux-system
      # Chart changes deploy on every commit without needing to bump helm/Chart.yaml's own
      # `version: 0.0.1` first.
      reconcileStrategy: Revision
  # Not `optional` - if External Secrets Operator hasn't synced this yet, the release should fail
  # loudly and retry, not silently render with `.Values.vpn` etc. empty.
  valuesFrom:
    - kind: Secret
      name: infrastructure-values
      valuesKey: values.yaml
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  timeout: 15m
  interval: 30m
  driftDetection:
    # Start in warn mode until it's clear the tailscale-operator/nvidia-device-plugin subcharts
    # (which reconcile their own state, e.g. ProxyGroup status) don't trip false positives -
    # switch to `enabled` once that's confirmed.
    mode: warn
