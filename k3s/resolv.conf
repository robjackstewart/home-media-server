# Upstream resolvers for CoreDNS and for pods using dnsPolicy: Default.
# NOT the router (192.168.50.1): it returns UK ISP block records
# (ukispblk.vo.llnwd.net.edgesuite.net) for tracker domains, which surfaces in Prowlarr as
# "Name does not resolve". Plaintext :53 to these resolvers is not intercepted on this line
# (verified with dig @1.1.1.1).
nameserver 1.1.1.1
nameserver 9.9.9.9
