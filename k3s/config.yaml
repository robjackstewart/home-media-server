# Declarative k3s server configuration.
# Installed to /etc/rancher/k3s/config.yaml by `task k3s:config:install`.
# k3s reads this on start, so changes require a service restart.

# Traefik is disabled: this chart uses no in-cluster Ingress controller. Each app is exposed
# individually over the tailnet by the tailscale-operator's own "tailscale" IngressClass - see
# the "Remote access" section in README.md.
disable:
  - traefik

# Marks the node as GPU-capable. The nvidia-device-plugin DaemonSet selects on this.
node-label:
  - nvidia.com/gpu.present=true

# Lets the kubeconfig be read without sudo so `task k3s:use-kube-context` works.
write-kubeconfig-mode: "0644"
