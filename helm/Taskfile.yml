version: '3'

env:
  HELM_RELEASE_NAME: home-media-server
  HELM_RELEASE_NAMESPACE: home-media-server
  HELM_VALUES_FILE: values.yaml

tasks:
  environment:check:
    preconditions:
      - sh: helm version
        msg: Helm must be installed
      - sh: kubectl version --client
        msg: kubectl must be installed

  repos:add:
    desc: Register the classic (non-OCI) chart repositories this chart depends on.
    cmds:
      # `helm dependency build` resolves classic HTTP repositories through the local repo
      # list, so they have to be registered before it will run - on a fresh machine it
      # fails with "no repository definition for ...". OCI dependencies need no registration.
      # `--force-update` makes this idempotent.
      - helm repo add nvidia-device-plugin https://nvidia.github.io/k8s-device-plugin --force-update
      - helm repo update nvidia-device-plugin
      - helm repo add tailscale https://pkgs.tailscale.com/helmcharts --force-update
      - helm repo update tailscale

  dependencies:build:
    desc: build helm dependencies
    deps:
      - repos:add
    cmds:
      - helm dependency build

  dependencies:update:
    desc: update helm dependencies
    deps:
      - repos:add
    cmds:
      - helm dependency update

  crds:apply:
    desc: Apply all required CRDs
    cmds:
      - task tailscale:crds:apply

  tailscale:crds:apply:
    desc: |
      Apply the tailscale-operator CRDs (ProxyGroup, ProxyClass, Connector, ...) from the local
      subchart before the release, so the ProxyGroup custom resource in templates/tailscale.yaml
      never races the CRD's own registration. The chart ships these as ordinary templates gated
      on .Values.installCRDs rather than in a genuine crds/ directory, so `helm show crds` won't
      find them - `helm template` with --show-only does. The published .tgz filename carries a
      build suffix and digest, hence the glob.

      Must run somewhere with a working kubeconfig for this cluster - i.e. locally
      (`task recreate` calls this), not from CI, which has no Kubernetes access at all (see
      .github/workflows/deploy.yml). Needs re-running by hand whenever a tailscale-operator chart
      bump changes these CRDs, until improvements.md's OPS-1 follow-up (splitting this subchart
      into its own Flux-managed HelmRelease with installCRDs: true) removes the need for this
      task entirely.
    cmds:
      - |
        TS_VERSION=$(grep -A2 'tailscale-operator' Chart.lock | grep version | awk '{print $2}')
        TS_CHART=$(ls ./charts/tailscale-operator-${TS_VERSION}-*.tgz | head -1)
        helm template tailscale-operator "$TS_CHART" \
          --show-only templates/proxygroup.yaml --show-only templates/proxyclass.yaml \
          --show-only templates/proxygrouppolicy.yaml --show-only templates/connector.yaml \
          --show-only templates/dnsconfig.yaml --show-only templates/recorder.yaml \
          --show-only templates/tailnet.yaml --show-only templates/peerrelay.yaml \
          | kubectl apply --server-side -f -

  lint:
    desc: |
      Lint the chart against the CI fixture values (sample.infrastructure.values.yaml stands in
      for what External Secrets Operator syncs into infrastructure-values at runtime - see
      ../clusters/home/external-secret.yaml). Used by ci.yml; also useful locally.
    preconditions:
      - test -f $HELM_VALUES_FILE
      - test -f sample.infrastructure.values.yaml
    cmds:
      - helm dependency build
      - helm lint . --values $HELM_VALUES_FILE --values sample.infrastructure.values.yaml

  template:
    desc: Render the chart against the CI fixture values, for a quick local sanity check.
    preconditions:
      - test -f $HELM_VALUES_FILE
      - test -f sample.infrastructure.values.yaml
    cmds:
      - helm dependency build
      - helm template "$HELM_RELEASE_NAME" . --namespace "$HELM_RELEASE_NAMESPACE" --values $HELM_VALUES_FILE --values sample.infrastructure.values.yaml {{.CLI_ARGS}}

  values:pull:
    desc: |
      Fetch the live infrastructure-values Secret ESO has synced from Key Vault, for rendering
      the chart against real values instead of the CI fixture (e.g. `task helm:template --
      --values <(task helm:values:pull)`).
    cmds:
      - kubectl get secret infrastructure-values -n "$HELM_RELEASE_NAMESPACE" -o go-template='{{"{{"}} index .data "values.yaml" | base64decode {{"}}"}}'