version: '3'

env:
  HELM_RELEASE_NAME: home-media-server
  HELM_RELEASE_NAMESPACE: home-media-server
  HELM_VALUES_FILE: values.yaml
  HELM_INFRASTRUCTURE_VALUES_FILE: infrastructure.values.yaml

vars:
  # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
  GATEWAY_API_VERSION: "1.4.1"

tasks:
  environment:check:
    preconditions:
      - sh: helm version
        msg: Helm must be installed
      - sh: kubectl version --client
        msg: kubectl must be installed

  repos:add:
    desc: Register the classic (non-OCI) chart repositories this chart depends on.
    cmds:
      # `helm dependency build` resolves classic HTTP repositories through the local repo
      # list, so they have to be registered before it will run - on a fresh machine it
      # fails with "no repository definition for ...". OCI dependencies such as
      # nginx-gateway-fabric need no registration. `--force-update` makes this idempotent.
      - helm repo add nvidia-device-plugin https://nvidia.github.io/k8s-device-plugin --force-update
      - helm repo update nvidia-device-plugin
      - helm repo add tailscale https://pkgs.tailscale.com/helmcharts --force-update
      - helm repo update tailscale

  dependencies:build:
    desc: build helm dependencies
    deps:
      - repos:add
    cmds:
      - helm dependency build

  dependencies:update:
    desc: update helm dependencies
    deps:
      - repos:add
    cmds:
      - helm dependency update

  crds:apply:
    desc: Apply all required CRDs
    cmds:
      - task gateway-api:crds:apply
      - task nginx-gateway-fabric:crds:apply
      - task tailscale:crds:apply

  dependencies:compatability:check:
    preconditions:
      - sh: |
          NGF_VERSION=$(grep -A2 'nginx-gateway-fabric' Chart.lock | grep version | awk '{print $2}')
          REQUIRED=$(curl -s "https://raw.githubusercontent.com/nginx/nginx-gateway-fabric/v${NGF_VERSION}/config/crd/gateway-api/standard/kustomization.yaml" | grep -oP 'ref=\Kv[^&]+' | sed 's/^v//')
          [ "$REQUIRED" = "{{.GATEWAY_API_VERSION}}" ]
        msg: "GATEWAY_API_VERSION ({{.GATEWAY_API_VERSION}}) does not match the version required by nginx-gateway-fabric. Update GATEWAY_API_VERSION in helm/Taskfile.yml."


  gateway-api:crds:apply:
    desc: Apply Gateway API CRDs for the required version
    cmds:
      - kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v{{.GATEWAY_API_VERSION}}/standard-install.yaml

  nginx-gateway-fabric:crds:apply:
    desc: Apply nginx-gateway-fabric CRDs from the local subchart
    cmds:
      - |
        NGF_VERSION=$(grep -A2 'nginx-gateway-fabric' Chart.lock | grep version | awk '{print $2}')
        helm show crds ./charts/nginx-gateway-fabric-${NGF_VERSION}.tgz | kubectl apply --server-side -f -

  tailscale:crds:apply:
    desc: |
      Apply the tailscale-operator CRDs (ProxyGroup, ProxyClass, Connector, ...) from the local
      subchart before the release, the same way nginx-gateway-fabric's CRDs are applied above.
      The chart ships these as ordinary templates gated on .Values.installCRDs rather than in a
      crds/ directory, so `helm show crds` won't find them - `helm template` with --show-only
      does. The published .tgz filename carries a build suffix and digest, hence the glob.
    cmds:
      - |
        TS_VERSION=$(grep -A2 'tailscale-operator' Chart.lock | grep version | awk '{print $2}')
        TS_CHART=$(ls ./charts/tailscale-operator-${TS_VERSION}-*.tgz | head -1)
        helm template tailscale-operator "$TS_CHART" \
          --show-only templates/proxygroup.yaml --show-only templates/proxyclass.yaml \
          --show-only templates/proxygrouppolicy.yaml --show-only templates/connector.yaml \
          --show-only templates/dnsconfig.yaml --show-only templates/recorder.yaml \
          --show-only templates/tailnet.yaml --show-only templates/peerrelay.yaml \
          | kubectl apply --server-side -f -

  release:
    desc: Create a helm release
    preconditions:
      - test -f $HELM_INFRASTRUCTURE_VALUES_FILE
      - test -f $HELM_VALUES_FILE
    cmds:
      - helm upgrade --install "$HELM_RELEASE_NAME" . --namespace "$HELM_RELEASE_NAMESPACE" --values $HELM_VALUES_FILE --values $HELM_INFRASTRUCTURE_VALUES_FILE --create-namespace --timeout 3000s {{.CLI_ARGS}} --skip-crds

  release:uninstall:
    desc: Create a helm release
    cmds:
      - helm uninstall "$HELM_RELEASE_NAME" --namespace "$HELM_RELEASE_NAMESPACE" --wait {{.CLI_ARGS}}