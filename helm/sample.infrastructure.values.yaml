# Generated by `terraform apply` into infrastructure.values.yaml - this file is the shape
# of that output, kept in sync with the yamlencode block in infrastructure/main.tf.
Timezone: Europe/London
PUID: "1000"
PGID: "1000"
transmissionopenvpn:
  webui: flood-for-transmission
vpn:
  provider:
    name: mullvad
    env:
      - name: SERVER_COUNTRIES
        value: UK
      - name: OWNED_ONLY
        value: 'yes'
  auth:
    secret:
      name: vpn-credentials
      keys:
        username: username
        password: password
tailnet: tailxxxx.ts.net
mylar3:
  auth:
    secret:
      name: mylar3-credentials
      keys:
        comicvine_api_key: comicvine_api_key
rreadingGlasses:
  auth:
    secret:
      name: rreading-glasses-credentials
      keys:
        hardcover_auth: hardcover_auth
        postgres_password: postgres_password
storage:
  host:
    config:
      dir: /example-config-dir-path
      capacity: 1Gi
    media:
      dir: /example-media-dir-path
      capacity: 1Gi
