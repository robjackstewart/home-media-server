# Generated by `terraform apply` into infrastructure.values.yaml - this file is the shape
# of that output, kept in sync with the yamlencode block in infrastructure/main.tf.
Timezone: Europe/London
PUID: "1000"
PGID: "1000"
transmissionopenvpn:
  webui: flood-for-transmission
vpn:
  provider:
    name: mullvad
    env:
      - name: SERVER_COUNTRIES
        value: UK
      - name: OWNED_ONLY
        value: 'yes'
  auth:
    secret:
      name: vpn-credentials
      keys:
        username: username
        password: password
domain:
  zone: example.domain.com
  main: example.domain.com
storage:
  host:
    config:
      dir: /example-config-dir-path
      capacity: 1Gi
    media:
      dir: /example-media-dir-path
      capacity: 1Gi
argoTunnel:
  name: example-argo-tunnel
  id: example-argo-tunnel-id
  credentials:
    secretName: argo-tunnel-credentials
