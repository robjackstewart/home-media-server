# The shape of the merged values ESO syncs into the `infrastructure-values` Secret at runtime -
# see infrastructure/main.tf's locals.infrastructure_values (what gets yamlencode'd into Key
# Vault) and clusters/home/external-secret.yaml. Used as CI's fixture (`task helm:lint`/`task
# helm:template`) so the chart can be rendered/linted without cluster access. Keep this in sync
# with locals.infrastructure_values by hand - there's no automated check that they match.
Timezone: Europe/London
PUID: "1000"
PGID: "1000"
transmission:
  webui: flood-for-transmission
vpn:
  provider:
    name: mullvad
    env:
      - name: SERVER_COUNTRIES
        value: UK
      - name: OWNED_ONLY
        value: 'yes'
  auth:
    secret:
      name: vpn-credentials
      keys:
        wireguard_private_key: wireguard_private_key
tailnet: tailxxxx.ts.net
mylar3:
  auth:
    secret:
      name: mylar3-credentials
      keys:
        comicvine_api_key: comicvine_api_key
rreadingGlasses:
  auth:
    secret:
      name: rreading-glasses-credentials
      keys:
        hardcover_auth: hardcover_auth
        postgres_password: postgres_password
storage:
  host:
    config:
      dir: /example-config-dir-path
      capacity: 1Gi
    media:
      dir: /example-media-dir-path
      capacity: 1Gi
