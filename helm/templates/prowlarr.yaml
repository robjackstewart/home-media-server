apiVersion: v1
kind: Service
metadata:
  name: prowlarr-service
spec:
  clusterIP: {{ .Values.prowlarr.clusterIP }}
  ports:
  - name: http
    port: {{ .Values.prowlarr.ports.http }}
    targetPort: {{ .Values.prowlarr.ports.http }}
    protocol: TCP
  selector:
    app: prowlarr
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prowlarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
      initContainers:
      {{- include "arrExternalAuthInitContainer" (dict
           "image" .Values.hostStorageBootstrap.image
           "subPath" "prowlarr") | nindent 6 }}
      containers:
      - name: flaresolverr
        env:
          - name: TZ
            value: {{ .Values.Timezone }}
          - name: LOG_LEVEL
            value: debug
        image: {{ include "image" .Values.prowlarr.flaresolverr.image }}
        imagePullPolicy: {{ .Values.prowlarr.flaresolverr.image.pullPolicy }}
        # Chromium under the hood, solving a JS challenge against the clock: a 1-core limit
        # throttles it hard enough that Cloudflare challenges blow past FlareSolverr's own
        # 60s per-request timeout, and since it solves one request at a time, every later
        # indexer test then queues up behind that backlog - what looked like Prowlarr "test"
        # hanging forever was actually this. The node has 12 cores and normally idles under
        # 20%, so there's room to let it burst instead of budget-matching Prowlarr's own 1
        # core; memory raised alongside it since usage was already brushing the old 1Gi cap.
        resources:
          limits:
            cpu: '4'
            memory: 2Gi
        ports:
          - containerPort: {{ .Values.prowlarr.flaresolverr.ports.http }}
        # tcpSocket, not httpGet: "/" returns a JSON banner with no dedicated health endpoint,
        # and "/v1" only accepts POST.
        startupProbe:
          tcpSocket:
            port: {{ .Values.prowlarr.flaresolverr.ports.http }}
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 20
        livenessProbe:
          tcpSocket:
            port: {{ .Values.prowlarr.flaresolverr.ports.http }}
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
      - name: prowlarr
        env:
          - name: TZ
            value: {{ .Values.Timezone }}
          - name: PUID
            value: "{{ .Values.PUID }}"
          - name: PGID
            value: "{{ .Values.PGID }}"
        resources:
          limits:
            cpu: '1'
            memory: 250Mi
        image: {{ include "image" .Values.prowlarr.image }}
        imagePullPolicy: {{ .Values.prowlarr.image.pullPolicy }}

        volumeMounts:
          - name: config
            mountPath: /config
            subPath: prowlarr
        startupProbe:
          tcpSocket:
            port: {{ .Values.prowlarr.ports.http }}
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 20
        livenessProbe:
          httpGet:
            path: /ping
            port: {{ .Values.prowlarr.ports.http }}
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ping
            port: {{ .Values.prowlarr.ports.http }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 1
        ports:
          - containerPort: {{ .Values.prowlarr.ports.http }}
---
{{ include "tailscaleIngress" (dict
     "name" "prowlarr-ingress"
     "subdomain" .Values.prowlarr.subdomain
     "service" "prowlarr-service"
     "port" .Values.prowlarr.ports.http
     "proxyGroup" .Values.tailscale.proxyGroup.name) }}
