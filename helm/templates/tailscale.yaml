# Fronts every app's Tailscale Ingress (see templates/functions.tpl's "tailscaleIngress" helper)
# with one shared proxy StatefulSet and one tailnet device, rather than the operator's default
# of a separate StatefulSet and device per Ingress.
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: {{ .Values.tailscale.proxyGroup.name }}
spec:
  type: ingress
  replicas: {{ .Values.tailscale.proxyGroup.replicas }}
  proxyClass: {{ .Values.tailscale.proxyGroup.name }}
---
# Carries the ProxyGroup's own resource requests/limits - not exposed directly on ProxyGroup
# itself, only via a referenced ProxyClass (spec.statefulSet.pod.tailscaleContainer.resources).
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: {{ .Values.tailscale.proxyGroup.name }}
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        resources:
          {{- .Values.tailscale.proxyGroup.resources | toYaml | nindent 10 }}
