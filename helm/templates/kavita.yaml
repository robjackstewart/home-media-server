apiVersion: v1
kind: Service
metadata:
  name: kavita-service
spec:
  clusterIP: {{ .Values.kavita.clusterIP }}
  ports:
  - name: http
    port: {{ .Values.kavita.ports.http }}
    targetPort: {{ .Values.kavita.ports.http }}
    protocol: TCP
  selector:
    app: kavita
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kavita
spec:
  # replicas is owned by the KEDA ScaledObject below (0-1), not by this chart.
  selector:
    matchLabels:
      app: kavita
  template:
    metadata:
      labels:
        app: kavita
    spec:
      terminationGracePeriodSeconds: 60
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: config
          persistentVolumeClaim:
            claimName: config
      containers:
        - env:
          - name: TZ
            value: {{ .Values.Timezone }}
          - name: PUID
            value: "{{ .Values.PUID }}"
          - name: PGID
            value: "{{ .Values.PGID }}"
          # 512Mi OOMKilled it (exit 137) during a real library scan - cover-image generation for
          # a handful of large .cbz/.cbr files spikes well past that. The proxy fronting every
          # app's tailnet Ingress returns a Bad Gateway for the gap while a backend pod is
          # restarting, which is what actually surfaced this - the fix is headroom here, not
          # anything about the Tailscale side.
          resources:
            limits:
              memory: 1Gi
          image: {{ include "image" .Values.kavita.image }}
          imagePullPolicy: {{ .Values.kavita.image.pullPolicy }}
          name: kavita
          ports:
            - containerPort: {{ .Values.kavita.ports.http }}
          volumeMounts:
            # Read-only: Kavita only reads the library and emails from it (Send to Kindle). It
            # never needs to write here, and read-only keeps it from ever colliding with what
            # Bookshelf/Mylar3 are doing to the same files.
            - name: media
              mountPath: /books
              subPath: books
              readOnly: true
            - name: media
              mountPath: /comics
              subPath: comics
              readOnly: true
            - name: config
              mountPath: /config
              subPath: kavita
          startupProbe:
            tcpSocket:
              port: {{ .Values.kavita.ports.http }}
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.kavita.ports.http }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.kavita.ports.http }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 1
---
{{ include "tailscaleIngress" (dict
     "name" "kavita-ingress"
     "subdomain" .Values.kavita.subdomain
     "service" "kavita-service"
     "port" .Values.kavita.ports.http
     "proxyGroup" .Values.tailscale.proxyGroup.name
     "interceptor" (ternary .Values.keda.interceptor nil .Values.kavita.onDemand.enabled)) }}
{{- if .Values.kavita.onDemand.enabled }}
---
{{ include "kedaInterceptorRoute" (dict
     "name" "kavita"
     "service" "kavita-service"
     "port" .Values.kavita.ports.http
     "host" (printf "%s.%s" .Values.kavita.subdomain .Values.tailnet)
     "readinessTimeout" .Values.kavita.onDemand.readinessTimeout) }}
---
{{ include "kedaScaledObject" (dict
     "name" "kavita"
     "cooldownPeriod" .Values.kavita.onDemand.cooldownPeriod
     "timezone" .Values.Timezone
     "cronStart" .Values.keda.cron.start
     "cronEnd" .Values.keda.cron.end
     "scalerAddress" .Values.keda.scalerAddress) }}
{{- end }}
