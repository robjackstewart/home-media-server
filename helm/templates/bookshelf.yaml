apiVersion: v1
kind: Service
metadata:
  name: bookshelf-service
spec:
  clusterIP: {{ .Values.bookshelf.clusterIP }}
  ports:
  - name: http
    port: {{ .Values.bookshelf.ports.http }}
    targetPort: {{ .Values.bookshelf.ports.http }}
    protocol: TCP
  selector:
    app: bookshelf
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookshelf
  template:
    metadata:
      labels:
        app: bookshelf
    spec:
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: config
          persistentVolumeClaim:
            claimName: config
      initContainers:
      {{- include "arrExternalAuthInitContainer" (dict
           "image" .Values.hostStorageBootstrap.image
           "subPath" "bookshelf") | nindent 6 }}
      containers:
        - env:
          - name: TZ
            value: {{ .Values.Timezone }}
          - name: PUID
            value: "{{ .Values.PUID }}"
          - name: PGID
            value: "{{ .Values.PGID }}"
          # Overrides the image's own default (the public, shared-rate-limited
          # https://hardcover.bookinfo.pro) with the self-hosted instance in
          # templates/rreading-glasses.yaml, which uses this deployment's own Hardcover API quota.
          - name: METADATA_URL
            value: {{ printf "http://rreading-glasses-service:%d" (.Values.rreadingGlasses.ports.http | int) | quote }}
          resources:
            limits:
              memory: 1Gi
          image: {{ include "image" .Values.bookshelf.image }}
          imagePullPolicy: {{ .Values.bookshelf.image.pullPolicy }}
          name: bookshelf
          ports:
            - containerPort: {{ .Values.bookshelf.ports.http }}
          volumeMounts:
            - name: media
              mountPath: /downloads
              subPath: downloads
            - name: media
              mountPath: /books
              subPath: books
            - name: config
              mountPath: /config
              subPath: bookshelf
          startupProbe:
            tcpSocket:
              port: {{ .Values.bookshelf.ports.http }}
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.bookshelf.ports.http }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.bookshelf.ports.http }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 1
---
{{ include "tailscaleIngress" (dict
     "name" "bookshelf-ingress"
     "subdomain" .Values.bookshelf.subdomain
     "service" "bookshelf-service"
     "port" .Values.bookshelf.ports.http
     "proxyGroup" .Values.tailscale.proxyGroup.name) }}
