apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
spec:
  clusterIP: {{ .Values.jellyfin.clusterIP }}
  ports:
    - name: http
      port: {{ .Values.jellyfin.ports.http.cluster }}
      protocol: TCP
      targetPort: {{ .Values.jellyfin.ports.http.cluster }}
    - name: https
      port: {{ .Values.jellyfin.ports.https.cluster }}
      protocol: TCP
      targetPort: {{ .Values.jellyfin.ports.https.cluster }}
    - name: standard-auto-discovery
      port: {{ .Values.jellyfin.ports.autoDiscovery.standard.cluster }}
      protocol: UDP
      targetPort: {{ .Values.jellyfin.ports.autoDiscovery.standard.cluster }}
    - name: service-auto-discovery
      port: {{ .Values.jellyfin.ports.autoDiscovery.service.cluster }}
      protocol: UDP
      targetPort: {{ .Values.jellyfin.ports.autoDiscovery.service.cluster }}
  selector:
    app: jellyfin
  type: ClusterIP
---
# Exposed on the LAN for the NVIDIA Shield. k3s's built-in ServiceLB (klipper) binds these
# ports directly onto the host's LAN interface, so the Shield reaches 8096 as 8096.
#
# This replaces the old NodePort service, which only reached the LAN because k3d mapped
# host 8096 -> nodePort 30096 and a PowerShell netsh portproxy forwarded Windows -> WSL.
# Both of those layers are gone. UDP 7359/1900 auto-discovery now works natively, rather
# than being broken by WSL2's NAT.
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-lan
spec:
  selector:
    app: jellyfin
  ports:
    - protocol: TCP
      name: http
      port: {{ .Values.jellyfin.ports.http.cluster }}
      targetPort: {{ .Values.jellyfin.ports.http.cluster }}
    - protocol: TCP
      name: https
      port: {{ .Values.jellyfin.ports.https.cluster }}
      targetPort: {{ .Values.jellyfin.ports.https.cluster }}
    - protocol: UDP
      name: standard-auto-discovery
      port: {{ .Values.jellyfin.ports.autoDiscovery.standard.cluster }}
      targetPort: {{ .Values.jellyfin.ports.autoDiscovery.standard.cluster }}
    - name: service-auto-discovery
      protocol: UDP
      port: {{ .Values.jellyfin.ports.autoDiscovery.service.cluster }}
      targetPort: {{ .Values.jellyfin.ports.autoDiscovery.service.cluster }}
  type: LoadBalancer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      runtimeClassName: nvidia
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: media
          persistentVolumeClaim:
            claimName: media
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
      - env:
        - name: TZ
          value: {{ .Values.Timezone }}
        - name: PUID
          value: "{{ .Values.PUID }}"
        - name: PGID
          value: "{{ .Values.PGID }}"
        image: {{ include "image" .Values.jellyfin.image }}
        imagePullPolicy: {{ .Values.jellyfin.image.pullPolicy }}
        resources:
          limits:
            nvidia.com/gpu: 1
        name: jellyfin
        ports:
          - containerPort: {{ .Values.jellyfin.ports.http.cluster }}
        volumeMounts:
          - name: config
            mountPath: /config
            subPath: jellyfin
          - name: media
            mountPath: /movies
            subPath: movies
          - name: media
            mountPath: /tv
            subPath: tv
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.jellyfin.ports.http.cluster }}
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.jellyfin.ports.http.cluster }}
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-routes
spec:
  parentRefs:
  - name: media-server-gateway
    sectionName: http
  hostnames:
  - {{ printf "%s.%s" .Values.jellyfin.subdomain .Values.domain.zone }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: jellyfin-service
      port: {{ .Values.jellyfin.ports.http.cluster }}