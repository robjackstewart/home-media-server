apiVersion: v1
kind: Service
metadata:
  name: bazarr-service
spec:
  clusterIP: {{ .Values.bazarr.clusterIP }}
  ports:
  - name: http
    port: {{ .Values.bazarr.ports.http }}
    targetPort: {{ .Values.bazarr.ports.http }}
    protocol: TCP
  selector:
    app: bazarr
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bazarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: config
          persistentVolumeClaim:
            claimName: config
      initContainers:
      {{- include "bazarrSubsyncInitContainer" (dict
           "image" .Values.hostStorageBootstrap.image
           "subPath" "bazarr"
           "subsync" .Values.bazarr.subsync) | nindent 6 }}
      containers:
      - env:
        - name: TZ
          value: {{ .Values.Timezone }}
        - name: PUID
          value: "{{ .Values.PUID }}"
        - name: PGID
          value: "{{ .Values.PGID }}"
        resources:
          {{- toYaml .Values.bazarr.resources | nindent 10 }}
        image: {{ include "image" .Values.bazarr.image }}
        imagePullPolicy: {{ .Values.bazarr.image.pullPolicy }}
        name: bazarr
        volumeMounts:
          - name: config
            mountPath: /config
            subPath: bazarr
          - name: media
            mountPath: movies
            subPath: movies
          - name: media
            mountPath: tv
            subPath: tv
        ports:
          - containerPort: {{ .Values.bazarr.ports.http }}
        startupProbe:
          tcpSocket:
            port: {{ .Values.bazarr.ports.http }}
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 20
        # Bazarr's unauthenticated health endpoint (returns 200 on the live instance). Without
        # these a hung process was never restarted - the "appears to crash" half of the bug.
        livenessProbe:
          httpGet:
            path: /api/system/ping
            port: {{ .Values.bazarr.ports.http }}
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/system/ping
            port: {{ .Values.bazarr.ports.http }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 1
---
{{ include "tailscaleIngress" (dict
     "name" "bazarr-ingress"
     "subdomain" .Values.bazarr.subdomain
     "service" "bazarr-service"
     "port" .Values.bazarr.ports.http
     "proxyGroup" .Values.tailscale.proxyGroup.name) }}
