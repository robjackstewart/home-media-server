apiVersion: v1
kind: Service
metadata:
  name: seerr-service
spec:
  clusterIP: {{ .Values.seerr.clusterIP }}
  ports:
  - name: http
    port: {{ .Values.seerr.ports.http }}
    targetPort: {{ .Values.seerr.ports.http }}
    protocol: TCP
  selector:
    app: seerr
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seerr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
      initContainers:
        - name: chown-config
          image: {{ include "image" .Values.seerr.image }}
          imagePullPolicy: {{ .Values.seerr.image.pullPolicy }}
          command:
            - sh
            - -c
            - chown -R 1000:1000 /app/config
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /app/config
              subPath: seerr
      containers:
        - env:
          - name: TZ
            value: {{ .Values.timezone }}
          resources:
            limits:
              memory: 1Gi
          image: {{ include "image" .Values.seerr.image }}
          imagePullPolicy: {{ .Values.seerr.image.pullPolicy }}
          name: seerr
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: {{ .Values.seerr.ports.http }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              subPath: seerr
          startupProbe:
            tcpSocket:
              port: {{ .Values.seerr.ports.http }}
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: {{ .Values.seerr.ports.http }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: {{ .Values.seerr.ports.http }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr-routes
spec:
  parentRefs:
  - name: media-server-gateway
    sectionName: http
  hostnames:
  - {{ printf "%s.%s" .Values.seerr.subdomain .Values.domain.zone }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: seerr-service
      port: {{ .Values.seerr.ports.http }}
