apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: media-server-gateway
spec:
  gatewayClassName: {{ .Values.gateway.className | default "nginx" }}
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media-server-routes
spec:
  parentRefs:
  - name: media-server-gateway
    sectionName: http
  hostnames:
  - {{ .Values.domain.main }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: heimdall-service
      port: {{ .Values.heimdall.ports.http }}
