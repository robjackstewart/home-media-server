apiVersion: v1
kind: Service
metadata:
  name: babybuddy-service
spec:
  clusterIP: {{ .Values.babybuddy.clusterIP }}
  ports:
  - name: http
    port: {{ .Values.babybuddy.ports.http }}
    targetPort: {{ .Values.babybuddy.ports.http }}
    protocol: TCP
  selector:
    app: babybuddy
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: babybuddy
spec:
  # replicas is owned by the KEDA ScaledObject below (0-1), not by this chart.
  selector:
    matchLabels:
      app: babybuddy
  template:
    metadata:
      labels:
        app: babybuddy
    spec:
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
      containers:
        - env:
          - name: TZ
            value: {{ .Values.Timezone }}
          - name: PUID
            value: "{{ .Values.PUID }}"
          - name: PGID
            value: "{{ .Values.PGID }}"
          - name: CSRF_TRUSTED_ORIGINS
            value: {{ printf "https://%s.%s" .Values.babybuddy.subdomain .Values.tailnet | quote }}
          resources:
            limits:
              cpu: '1'
              memory: 250Mi
          image: {{ include "image" .Values.babybuddy.image }}
          imagePullPolicy: {{ .Values.babybuddy.image.pullPolicy }}
          name: babybuddy
          ports:
            - containerPort: {{ .Values.babybuddy.ports.http }}
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: babybuddy
          startupProbe:
            tcpSocket:
              port: {{ .Values.babybuddy.ports.http }}
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.babybuddy.ports.http }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.babybuddy.ports.http }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 1
---
{{ include "tailscaleIngress" (dict
     "name" "babybuddy-ingress"
     "subdomain" .Values.babybuddy.subdomain
     "service" "babybuddy-service"
     "port" .Values.babybuddy.ports.http
     "proxyGroup" .Values.tailscale.proxyGroup.name
     "interceptor" (ternary .Values.keda.interceptor nil .Values.babybuddy.onDemand.enabled)) }}
{{- if .Values.babybuddy.onDemand.enabled }}
---
{{ include "kedaInterceptorRoute" (dict
     "name" "babybuddy"
     "service" "babybuddy-service"
     "port" .Values.babybuddy.ports.http
     "host" (printf "%s.%s" .Values.babybuddy.subdomain .Values.tailnet)
     "readinessTimeout" .Values.babybuddy.onDemand.readinessTimeout) }}
---
{{ include "kedaScaledObject" (dict
     "name" "babybuddy"
     "cooldownPeriod" .Values.babybuddy.onDemand.cooldownPeriod
     "timezone" .Values.Timezone
     "cronStart" .Values.keda.cron.start
     "cronEnd" .Values.keda.cron.end
     "scalerAddress" .Values.keda.scalerAddress) }}
{{- end }}
