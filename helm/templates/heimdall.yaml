apiVersion: v1
kind: Service
metadata:
  name: heimdall-service
spec:
  clusterIP: {{ .Values.heimdall.clusterIP }}
  ports:
  - port: {{ .Values.heimdall.ports.http }}
    protocol: TCP
  selector:
    app: heimdall
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: heimdall
spec:
  # replicas is owned by the KEDA ScaledObject below (0-1), not by this chart.
  selector:
    matchLabels:
      app: heimdall
  template:
    metadata:
      labels:
        app: heimdall
    spec:
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
      containers:
      - env:
        - name: TZ
          value: {{ .Values.Timezone }}
        - name: PUID
          value: "{{ .Values.PUID }}"
        - name: PGID
          value: "{{ .Values.PGID }}"
        resources:
          limits:
            cpu: '1'
            memory: 250Mi
        image: {{ include "image" .Values.heimdall.image }}
        name: heimdall
        imagePullPolicy: {{ .Values.heimdall.image.pullPolicy }}
        volumeMounts:
          - name: config
            mountPath: /config
            subPath: heimdall
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.heimdall.ports.http }}
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.heimdall.ports.http }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 1
        ports:
        - containerPort: {{ .Values.heimdall.ports.http }}
---
{{ include "tailscaleIngress" (dict
     "name" "heimdall-ingress"
     "subdomain" .Values.heimdall.subdomain
     "service" "heimdall-service"
     "port" .Values.heimdall.ports.http
     "proxyGroup" .Values.tailscale.proxyGroup.name
     "interceptor" (ternary .Values.keda.interceptor nil .Values.heimdall.onDemand.enabled)) }}
{{- if .Values.heimdall.onDemand.enabled }}
---
{{ include "kedaInterceptorRoute" (dict
     "name" "heimdall"
     "service" "heimdall-service"
     "port" .Values.heimdall.ports.http
     "host" (printf "%s.%s" .Values.heimdall.subdomain .Values.tailnet)
     "readinessTimeout" .Values.heimdall.onDemand.readinessTimeout) }}
---
{{ include "kedaScaledObject" (dict
     "name" "heimdall"
     "cooldownPeriod" .Values.heimdall.onDemand.cooldownPeriod
     "timezone" .Values.Timezone
     "cronStart" .Values.keda.cron.start
     "cronEnd" .Values.keda.cron.end
     "scalerAddress" .Values.keda.scalerAddress) }}
{{- end }}
