apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 1 # You could also consider elastic scaling for this deployment
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: {{ include "image" .Values.cloudflared.image }}
        imagePullPolicy: {{ .Values.cloudflared.image.pullPolicy }}
        args:
        - tunnel
        # Points cloudflared to the config file, which configures what
        # cloudflared will actually do. This file is created by a ConfigMap
        # below.
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        livenessProbe:
          httpGet:
            path: /ready
            port: {{ .Values.cloudflared.ports.http }}
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: {{ .Values.cloudflared.ports.http }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 1
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: creds
        secret:
          secretName: {{ .Values.argoTunnel.credentials.secretName }}
      - name: config
        configMap:
          name: cloudflared
          items:
          - key: config.yaml
            path: config.yaml

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
data:
  config.yaml: |
    # Name of the tunnel you want to run
    tunnel: {{ .Values.argoTunnel.id }}
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
    # This rule sends all requests to the Gateway API service
    - service: http://{{ .Release.Name }}-gateway-nginx:80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: media-server-gateway
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: {{ .Values.domain.main }}
  - name: homeassistant-http
    port: 80
    protocol: HTTP
    hostname: {{ .Values.domain.homeassistant }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media-server-routes
spec:
  parentRefs:
  - name: media-server-gateway
    sectionName: http
  hostnames:
  - {{ .Values.domain.main }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /radarr
    backendRefs:
    - name: radarr-service
      port: {{ .Values.radarr.ports.http }}
  - matches:
    - path:
        type: PathPrefix
        value: /sonarr
    backendRefs:
    - name: sonarr-service
      port: {{ .Values.sonarr.ports.http }}
  - matches:
    - path:
        type: PathPrefix
        value: /bazarr
    backendRefs:
    - name: bazarr-service
      port: {{ .Values.bazarr.ports.http }}
  - matches:
    - path:
        type: PathPrefix
        value: /prowlarr
    backendRefs:
    - name: prowlarr-service
      port: {{ .Values.prowlarr.ports.http }}
  - matches:
    - path:
        type: PathPrefix
        value: /transmission
    backendRefs:
    - name: transmission-service
      port: {{ .Values.transmission.ports.http }}
  - matches:
    - path:
        type: PathPrefix
        value: /jellyfin
    backendRefs:
    - name: jellyfin-service
      port: {{ .Values.jellyfin.ports.http.cluster }}
  - matches:
    - path:
        type: PathPrefix
        value: /calibre
    backendRefs:
    - name: calibre-service
      port: {{ .Values.calibre.nginx.ports.http }}
  - matches:
    - path:
        type: PathPrefix
        value: /heimdall
    backendRefs:
    - name: heimdall-service
      port: {{ .Values.heimdall.ports.http }}
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: heimdall-service
      port: {{ .Values.heimdall.ports.http }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homeassistant-routes
spec:
  parentRefs:
  - name: media-server-gateway
    sectionName: homeassistant-http
  hostnames:
  - {{ .Values.domain.homeassistant }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: homeassistant-service
      port: {{ .Values.homeassistant.ports.http }}