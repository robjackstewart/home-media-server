# Self-hosted metadata backend for Bookshelf (helm/templates/rreading-glasses.yaml), so its author
# searches use this deployment's own free Hardcover API quota instead of the shared rate limit on
# the public https://hardcover.bookinfo.pro proxy the image points at by default. No Ingress -
# purely an internal backend for Bookshelf, same as indexer-proxy-service.
rreadingGlasses:
  clusterIP: 10.43.178.137
  image:
    repository: blampe/rreading-glasses
    # Upstream only publishes floating `hardcover`/`latest` tags, no versioned releases, so -
    # like gluetun/transmission/payment-manager (see improvements.md OPS-3) - Renovate can't track
    # this one for updates; `pullPolicy: Always` is what keeps it current.
    tag: hardcover
    registry: docker.io
    pullPolicy: Always
  postgres:
    image:
      repository: postgres
      tag: '18'
      registry: docker.io
      pullPolicy: IfNotPresent
    user: rreading-glasses
    database: rreading-glasses
    ports:
      postgres: 5432
  ports:
    http: 8788

